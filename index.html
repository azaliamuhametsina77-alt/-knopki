<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fbfbfb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #4f5560;
      --shadow: 0 10px 28px rgba(24, 31, 56, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    .cards {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(240px, 1fr));
      gap: 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid #ffffff;
      border-radius: var(--radius);
      padding: 22px 20px 18px;
      min-height: 118px;
      box-shadow: var(--shadow);
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card__value {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.1;
    }

    .card__value strong {
      font-size: 42px;
      line-height: 1;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .card__desc {
      font-size: 15px;
      line-height: 1.35;
      color: var(--muted);
      font-weight: 500;
      max-width: 24ch;
    }

    @media (max-width: 1040px) {
      .cards {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }
    }

    @media (max-width: 680px) {
      .wrap {
        padding-inline: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card__value strong {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="cards" id="cards"></section>
  </div>

  <script>
    const WAR_START_DATE = '2023-04-15';

    function formatNumber(value) {
      return new Intl.NumberFormat('ru-RU').format(value);
    }

    function getWarDays(startDateStr) {
      const start = new Date(startDateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffMs = today - start;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      return diffDays + 1;
    }

    function getRussianDayWord(days) {
      const mod10 = days % 10;
      const mod100 = days % 100;

      if (mod10 === 1 && mod100 !== 11) return 'день войны';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня войны';
      return 'дней войны';
    }

    const warDays = getWarDays(WAR_START_DATE);

    const cards = [

      {
        value: warDays,
        description: getRussianDayWord(warDays),
        type: 'number'
      },
      {
        value: 59000,
        description: 'минимум смертей, связанных с конфликтом, на апрель 2026 года, по данным ACLED',
        type: 'number'
      },
      {
        value: 600,
        description: 'рост смертности в 2025 году по сравнению с 2024-м',
        type: 'percent'
      }
    ];

    const cardsContainer = document.getElementById('cards');

    function buildCards() {
      cardsContainer.innerHTML = cards.map(card => `
        <article class="card">
          <div class="card__value">
            <strong
              class="${card.type === 'percent' ? 'counter-percent' : 'counter-value'}"
              data-target="${card.value}"
            >
              ${card.type === 'percent' ? '0%' : '0'}
            </strong>
            <div class="card__desc">${card.description}</div>
          </div>
        </article>
      `).join('');
    }

    function animateNumber(element, target, duration = 1100) {
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(target * eased);
        element.textContent = formatNumber(current);

        if (progress < 1) {
          requestAnimationFrame(tick);
        }
      }

      requestAnimationFrame(tick);
    }

    function animatePercent(element, target, duration = 1100) {
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(target * eased);
        element.textContent = `${current}%`;

        if (progress < 1) {
          requestAnimationFrame(tick);
        }
      }

      requestAnimationFrame(tick);
    }

    function initAnimations() {
      document.querySelectorAll('.counter-value').forEach(el => {
        animateNumber(el, Number(el.dataset.target));
      });

      document.querySelectorAll('.counter-percent').forEach(el => {
        animatePercent(el, Number(el.dataset.target));
      });
    }

    buildCards();
    initAnimations();
  </script>
</body>
</html>
