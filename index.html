<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #1f2430;
      --muted: #4f5560;
      --accent: #d71c1c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fbfbfb;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: auto;
    }

    .wrap {
      width: 100%;
      margin: 0 auto;
      padding: 28px 16px 40px;
      background: transparent;
    }

    .counter-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
    }

    .counter-number {
      font-size: clamp(72px, 12vw, 170px);
      line-height: 0.92;
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--accent);
      margin: 0;
    }

    .counter-label {
      margin-top: 10px;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .wrap {
        padding: 20px 12px 28px;
      }

      .counter-label {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="counter-block" id="war-counter-block">
      <div class="counter-number" id="war-counter">0</div>
      <div class="counter-label" id="war-counter-label">дней войны</div>
    </section>
  </div>

  <script>
    const WAR_START_DATE = '2023-04-15T00:00:00';

    function formatNumber(value) {
      return new Intl.NumberFormat('ru-RU').format(value);
    }

    function getWarDays(startDateStr) {
      const start = new Date(startDateStr);
      const now = new Date();

      start.setHours(0, 0, 0, 0);
      now.setHours(0, 0, 0, 0);

      const diffMs = now - start;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      return diffDays + 1;
    }

    function getRussianDayWord(days) {
      const mod10 = days % 10;
      const mod100 = days % 100;

      if (mod10 === 1 && mod100 !== 11) return 'день войны';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня войны';
      return 'дней войны';
    }

    function animateNumber(element, target, duration = 1400) {
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(target * eased);

        element.textContent = formatNumber(current);

        if (progress < 1) {
          requestAnimationFrame(tick);
        }
      }

      requestAnimationFrame(tick);
    }

    const counterBlock = document.getElementById('war-counter-block');
    const counterElement = document.getElementById('war-counter');
    const labelElement = document.getElementById('war-counter-label');

    const warDays = getWarDays(WAR_START_DATE);
    labelElement.textContent = getRussianDayWord(warDays);

    let hasAnimated = false;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!hasAnimated && entry.isIntersecting) {
          hasAnimated = true;
          animateNumber(counterElement, warDays, 1400);
          observer.disconnect();
        }
      });
    }, {
      threshold: 0.45
    });

    observer.observe(counterBlock);
  </script>
</body>
</html>
